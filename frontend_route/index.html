<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Assistant</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="beauty.css">
</head>
<body>
    <div id="app-container">
      
        <div id="chat-history">
           
            <div id="welcome-screen">
                <div class="logo">⚡</div>
                <h1>Good Morning, Ahmed</h1>
                <p style="color: #888; font-size: 0.95rem; margin-top: 5px;">Upload a PDF to get started.</p>
            </div>
        </div>


        <div id="input-container">
            <form id="chatForm">
                
                <label for="fileInput" id="upload-btn">+</label>
                <input type="file" id="fileInput" name="file_name" accept=".pdf" style="display: none;">
                
                <input type="text" id="textInput" placeholder="How can I help you today?" autocomplete="off" disabled>
                
                <button type="submit" id="sendBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
